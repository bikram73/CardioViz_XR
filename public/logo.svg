<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#061423" stroke="#2fd9f4" stroke-width="4"/>
  <!-- Outer Orbit -->
  <ellipse
    cx="50"
    cy="50"
    rx="42"
    ry="22"
    stroke="#2fd9f4"
    stroke-width="5"
    transform="rotate(-25 50 50)"
    stroke-dasharray="180 30"
  />
  <!-- Concentric Artery Rings -->
  <circle cx="50" cy="50" r="32" stroke="#d6e4f9" stroke-width="4" />
  <circle cx="50" cy="50" r="20" stroke="#2fd9f4" stroke-width="4" />
  <circle cx="50" cy="50" r="8" fill="#2fd9f4" />
  <!-- Top diamond node -->
  <polygon points="50,10 54,16 50,22 46,16" fill="#2fd9f4" />
</svg>
